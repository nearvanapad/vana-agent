services:
  vana:
    build:
      context: .
      args:
        NEXT_PUBLIC_NEAR_RPC_URL: ${NEXT_PUBLIC_NEAR_RPC_URL:-https://rpc.mainnet.fastnear.com}
        NEXT_PUBLIC_DEMO_TOKEN: ${NEXT_PUBLIC_DEMO_TOKEN:-}
    env_file: .env
    environment:
      DATABASE_PATH: /data/vana.db
    # Reachable directly on this machine only; the public way in is Caddy.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - vana-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - vana
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  vana-data:
  caddy-data:
  caddy-config:
