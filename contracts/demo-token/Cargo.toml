[package]
name = "vana-demo-token"
version = "0.1.0"
edition = "2021"
publish = false
description = "A deliberately risky NEP-141 token for the VANA risk-check demo. Testnet only."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.98.1"
image_digest = ""
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
