# The stack on the server (~/apps/vana-agent), copied there at deploy. No source and no build
# on the server: the image is built on a developer machine and pulled from ghcr.io. Secrets come from
# .env next to this file (deploy/env.example). The way in is nearvana's Caddy, which reaches the app
# as vana-agent:3000 on the shared nearvana_default network and serves it on vana.nearvana.trade.
name: vana-agent

services:
  app:
    image: ${IMAGE:?set IMAGE in .env}
    container_name: vana-agent
    env_file: .env
    environment:
      # The SQLite file lives on the volume, whatever .env says.
      DATABASE_PATH: /data/vana.db
    volumes:
      - data:/data
    networks:
      nearvana:
        aliases: [vana-agent]
    # The server is shared with the nearvana stack and the OpenClaw agent.
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  data:

networks:
  # Owned by the nearvana stack (its Caddy is the server's only ingress); never created here.
  nearvana:
    external: true
    name: nearvana_default
